# Application de demonstration : modifier k8s/workloads/whoami puis git push
# -> ArgoCD deploie le changement tout seul
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bekoco/homelab.git
    targetRevision: main
    path: k8s/workloads/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
