# ArgoCD gere sa propre configuration (ingress, parametres) depuis Git
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bekoco/homelab.git
    targetRevision: main
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # ne jamais supprimer automatiquement la config d'ArgoCD
      selfHeal: true
