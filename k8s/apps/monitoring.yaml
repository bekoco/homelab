# Supervision : Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics
# Chart Helm kube-prometheus-stack, deploye par ArgoCD (aucune commande helm a la main)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.0
    helm:
      releaseName: monitoring
      valuesObject:
        # k3s n'expose pas ces composants (et utilise SQLite, pas etcd) :
        # les desactiver evite des cibles en erreur et de fausses alertes
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            # Decouvrir les ServiceMonitor de tout le cluster, pas seulement ceux du chart
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi

        alertmanager:
          alertmanagerSpec:
            # Configuration globale fournie par l'AlertmanagerConfig "homelab"
            # (k8s/monitoring-config), au lieu de la config par defaut du chart
            alertmanagerConfiguration:
              name: homelab
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

        grafana:
          # Identifiants dans un Secret cree hors de Git (ansible/bootstrap-secrets.yml)
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.192.168.11.201.nip.io
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD de Prometheus sont trop volumineuses pour un apply classique
      - ServerSideApply=true
