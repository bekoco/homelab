---
# Cree les secrets du cluster qui ne doivent pas etre dans Git.
# Les mots de passe sont generes une fois et gardes dans ~/.homelab (hors depot).
# Lancement : cd ansible && ./run.sh bootstrap-secrets.yml

- name: Creer les secrets hors Git
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ lookup('env', 'PATH') }}"
  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.homelab"
    grafana_password: "{{ lookup('ansible.builtin.password', secrets_dir + '/grafana-admin.txt', length=24, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Creer le namespace monitoring
      ansible.builtin.shell: >
        set -o pipefail &&
        kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: ns
      changed_when: "'created' in ns.stdout"

    - name: Creer le secret admin de Grafana
      ansible.builtin.shell: >
        set -o pipefail &&
        kubectl -n monitoring create secret generic grafana-admin
        --from-literal=admin-user=admin
        --from-literal=admin-password='{{ grafana_password }}'
        --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: secret
      changed_when: "'created' in secret.stdout or 'configured' in secret.stdout"
      no_log: true

    - name: Proteger le fichier du mot de passe
      ansible.builtin.file:
        path: "{{ secrets_dir }}/grafana-admin.txt"
        mode: "0600"

    # URLs des recepteurs d'alertes : lues dans ~/.homelab/*.txt si presents,
    # sinon valeur factice (la config reste valide, les envois echouent simplement)
    - name: Lire les URLs des recepteurs d'alertes
      ansible.builtin.set_fact:
        discord_webhook: "{{ lookup('ansible.builtin.file', secrets_dir + '/discord-webhook.txt', errors='ignore') | default('', true) | trim }}"
        healthchecks_url: "{{ lookup('ansible.builtin.file', secrets_dir + '/healthchecks-url.txt', errors='ignore') | default('', true) | trim }}"
      no_log: true

    - name: Creer le secret des recepteurs d'alertes
      ansible.builtin.shell: >
        set -o pipefail &&
        kubectl -n monitoring create secret generic alertmanager-receivers
        --from-literal=discord-webhook='{{ discord_webhook or placeholder_url }}'
        --from-literal=healthchecks-url='{{ healthchecks_url or placeholder_url }}'
        --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      vars:
        placeholder_url: https://example.invalid/a-configurer
      register: receivers
      changed_when: "'created' in receivers.stdout or 'configured' in receivers.stdout"
      no_log: true

    - name: Etat des recepteurs d'alertes
      ansible.builtin.debug:
        msg:
          - "Discord      : {{ 'configure' if discord_webhook else 'NON configure -> ~/.homelab/discord-webhook.txt' }}"
          - "healthchecks : {{ 'configure' if healthchecks_url else 'NON configure -> ~/.homelab/healthchecks-url.txt' }}"

    - name: Acces
      ansible.builtin.debug:
        msg: "Grafana : utilisateur admin, mot de passe dans {{ secrets_dir }}/grafana-admin.txt"
