---
# Installe ArgoCD puis l'application racine GitOps.
# S'execute depuis le PC (WSL) avec kubectl et le kubeconfig du depot.
# Lancement : cd ansible && ./run.sh argocd.yml

- name: Installer ArgoCD et amorcer le GitOps
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  environment:
    KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ lookup('env', 'PATH') }}"
  vars:
    k8s_dir: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Creer le namespace argocd
      ansible.builtin.shell: >
        set -o pipefail &&
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: ns
      changed_when: "'created' in ns.stdout"

    - name: Installer ArgoCD {{ argocd_version }} (manifeste officiel)
      ansible.builtin.command: >
        kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
      register: install
      changed_when: "'serverside-applied' in install.stdout and 'unchanged' not in install.stdout"

    - name: Appliquer la configuration ArgoCD (parametres + ingress)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/argocd/
      register: cfg
      changed_when: "'configured' in cfg.stdout or 'created' in cfg.stdout"

    - name: Redemarrer argocd-server pour prendre en compte les parametres
      ansible.builtin.command: kubectl -n argocd rollout restart deployment/argocd-server
      when: cfg is changed

    - name: Attendre que tous les composants ArgoCD soient prets
      ansible.builtin.command: kubectl -n argocd rollout status {{ item }} --timeout=300s
      loop:
        - deployment/argocd-server
        - deployment/argocd-repo-server
        - deployment/argocd-applicationset-controller
        - statefulset/argocd-application-controller
      changed_when: false

    - name: Creer l'application racine (app of apps)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/bootstrap/root-app.yaml
      register: root
      changed_when: "'created' in root.stdout or 'configured' in root.stdout"

    - name: Acces
      ansible.builtin.debug:
        msg:
          - "Interface : http://argocd.192.168.11.201.nip.io (utilisateur admin)"
          - "Mot de passe initial : kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d; echo"
